name: CI

on:
  push:
    branches: ["main"] # Run only on main branch
  pull_request:
    branches: ["**"] # Run on any branch
  schedule:
    - cron: "0 8 * * *" # Run at 8 AM UTC

jobs:
  type-check:
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        platform: [ubuntu-24.04]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install ".[typecheck,assistant,api]" -f https://download.pytorch.org/whl/cpu/torch_stable.html
      - name: Type checks with mypy
        run: mypy src test

  test:
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            platform: ubuntu-22.04
          - python-version: "3.10"
            platform: ubuntu-24.04
          - python-version: "3.11"
            platform: ubuntu-24.04
          - python-version: "3.12"
            platform: ubuntu-24.04

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install ".[test,sales,assistant,api,comparison-models]" -f https://download.pytorch.org/whl/cpu/torch_stable.html
      - name: Test with pytest
        run: pytest
